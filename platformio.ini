; ============================================================
; MatixYo ESP32-Drawing-Robot - ESP32-S3 ONLY (Project-wide)
; ============================================================

[platformio]
default_envs = esp32s3
description = Scara Drawing Robot (ESP32-S3 only)

[env]
platform = espressif32@6.7.0
framework = arduino

; Conservative, stable defaults
monitor_speed = 115200
upload_protocol = esptool
upload_speed = 460800

; Keep build deterministic
build_type = release
lib_ldf_mode = chain+
lib_compat_mode = strict

; If the repo has prebuild/merge scripts, keep them enabled.
; (These files exist in the repo root per README file list.)
extra_scripts =
  pre:prebuild.py
  post:merge-bin.py

; ------------------------------------------------------------
; ESP32-S3 environment (single source of truth)
; ------------------------------------------------------------
[env:esp32s3]
board = esp32-s3-devkitc-1

; Your chip reports 16MB flash and 8MB PSRAM, 40MHz crystal.
; Keep flash mode DIO (matches many S3 dev boards / quad flash).
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.f_cpu = 240000000L

extra_scripts = pre:prebuild.py, merge-bin.py
lib_deps = 
   madhephaestus/ESP32Servo @ 3.0.6
   tzapu/WiFiManager @ 2.0.17
   ESP32Async/ESPAsyncWebServer @ 3.6.2
   bblanchon/ArduinoJson @ 7.3.0
   
; If you use native USB CDC for Serial (recommended on S3):
build_flags =
  -I include/
  -D CORE_DEBUG_LEVEL=0

  ; Enable PSRAM (your chip reports PSRAM present)
  -D BOARD_HAS_PSRAM

  ; Native USB serial on S3 (lets you use the USB port as Serial)
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

  ; If code uses these common guards
  -D ESP32
  -D ESP32S3

; Optional: if your board sometimes fails to auto-reset into bootloader,
; uncomment and use "no-reset" workflow where you hold BOOT manually.
; upload_flags =
;   --before
;   no-reset
